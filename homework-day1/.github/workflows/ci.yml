name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  backend-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Build Backend
        run: go build -v ./cmd/api

      - name: Run Backend Tests
        run: go test -v ./...

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Gitleaks scan for hardcoded secrets
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # 2. Gosec scan for Go security vulnerabilities
      - name: Run Gosec Security Scan
        uses: securego/gosec@master
        with:
          args: ./...
        continue-on-error: true

      # 3. Trivy scan for filesystem vulnerabilities
      - name: Run Trivy FS Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'HIGH,CRITICAL'
        continue-on-error: true

      # 4. TruffleHog scan for secrets in history
      - name: TruffleHog OSS Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ""
          head: HEAD
        continue-on-error: true

  integration-test:
    name: Docker Compose Integration Test
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start services with Docker Compose
        run: docker compose up -d --build

      # 5. Trivy scan for Docker images
      - name: Run Trivy Docker Image Scan (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'homework-day1-backend:latest'
          format: 'table'
          severity: 'HIGH,CRITICAL'
        continue-on-error: true

      - name: Run Trivy Docker Image Scan (Frontend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'homework-day1-frontend:latest'
          format: 'table'
          severity: 'HIGH,CRITICAL'
        continue-on-error: true

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to start..."
          # Wait up to 60 seconds
          for i in {1..30}; do
            if curl -s http://localhost:8080/health | grep -q "status"; then
              echo "Backend is healthy!"
              break
            fi
            echo "Waiting..."
            sleep 2
          done

      - name: Run health check requests
        run: |
          echo "=== Backend Health Stats ==="
          curl -f http://localhost:8080/health
          echo -e "\n=== Frontend Response ==="
          curl -f http://localhost:3000

      - name: Stop services
        run: docker compose down -v
