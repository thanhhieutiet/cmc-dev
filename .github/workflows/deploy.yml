name: Auto Deploy to Production

# Chỉ kích hoạt khi có code đẩy lên nhánh 'deploy'
on:
  push:
    branches: [deploy]

jobs:
  deploy-and-test:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Kịch bản gõ lệnh trên server AWS
          script: |
            cd ~/cmc-dev
            git fetch --all
            git checkout deploy
            git pull origin deploy
            cd homework-day1
            docker compose down
            docker compose up -d --build
            docker compose ps

      - name: Health check via HTTPS
        run: |
          echo "Đợi 10 giây cho server khởi động..."
          sleep 10
          curl -f https://hieu-easm.ddns.net/health || exit 1
